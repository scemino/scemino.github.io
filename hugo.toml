theme = 'hello-friend-ng'
title = "scemino blog"
languageCode = "en-us"
enableEmoji     = true
disableRSS     = false
defaultContentLanguage = 'en'

[params]
  enableSharingButtons = true
  enableReadingTime = true
#  enableGlobalLanguageMenu = true
  enableThemeToggle = true

  [params.author]
    name = "Scemino"

  [params.footer]
    rss = true
    copyright = false
    author = true

    topText = []
    bottomText = []
  
  [[params.social]]
    name = "twitter"
    url  = "https://twitter.com/"

  [[params.social]]
    name = "github"
    url  = "https://github.com/scemino"

  
[languages]
  [languages.en]
    label = 'English'
    locale = 'en-US'
    title = "scemino blog"

  [languages.en.params]
    subtitle  = "A blog about my different projects"

    [languages.en.params.logo]
      logoText = "scemino blog"
      logoCursorDisabled = true
      logoHomeLink = "/posts"

#  [languages.fr]
#    label = 'Français'
#    locale = 'fr-FR'
#    title = "Le blog de scemino"
#
#    [languages.fr.params]
#      subtitle  = "Un blog à propos de mes differents projets"
#
#    [languages.fr.params.logo]
#      logoText = "scemino blog"
#      logoCursorDisabled = true
#      logoHomeLink = "/fr/posts"

  # And you can even create generic menu
  [[menu.main]]
    identifier = "blog"
    name       = "Posts"
    url        = "/posts"

[markup]
  [markup.highlight]
    style = 'base16-snazzy'
    